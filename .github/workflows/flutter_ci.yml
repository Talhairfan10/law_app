name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Firebase config files
        run: |
          cat << 'EOF' > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF
          cat << 'EOF' > lib/firebase_options.dart
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF

      - name: Validate secrets are not empty
        run: |
          echo "GOOGLE_SERVICES_JSON length: ${#GOOGLE_SERVICES_JSON}"
          echo "FIREBASE_OPTIONS_DART length: ${#FIREBASE_OPTIONS_DART}"
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}

      - name: Debug config files
        run: |
          cat lib/firebase_options.dart
          wc -l lib/firebase_options.dart

      - name: Verify Firebase config files are not empty
        run: |
          if [ ! -s lib/firebase_options.dart ]; then
            echo "ERROR: lib/firebase_options.dart is empty! Check that the FIREBASE_OPTIONS_DART GitHub Secret is set correctly."
            exit 1
          fi
          if [ ! -s android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json is empty! Check that the GOOGLE_SERVICES_JSON GitHub Secret is set correctly."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Print debug keystore SHA fingerprints
        working-directory: android
        run: bash gradlew signingReport

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
